<meta charset="UTF-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title></title>

<style type="text/css">
:root{
    --primary:#2563eb;
    --primary-hover:#1d4ed8;
    --text:#1f2937;
    --text-light:#6b7280;
    --border:#e5e7eb;
    --background:#f8fafc;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--background);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.card{
    width:100%;
    max-width:520px;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:20px;
    padding:40px 32px;
    box-shadow:
        0 10px 15px rgba(0,0,0,.04),
        0 4px 6px rgba(0,0,0,.02);
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:8px 14px;
    border-radius:999px;
    background:#eff6ff;
    color:var(--primary);
    font-size:14px;
    font-weight:600;
    margin-bottom:20px;
}

h1{
    font-size:30px;
    margin-bottom:12px;
}

.description{
    color:var(--text-light);
    margin-bottom:24px;
}

.info-box{
    background:#f9fafb;
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:24px;
}

.info-box p{
    color:var(--text-light);
    font-size:14px;
}

.hp-field{
    position:absolute;
    left:-9999px;
    opacity:0;
    pointer-events:none;
}

.button{
    width:100%;
    border:none;
    cursor:pointer;
    background:var(--primary);
    color:#fff;
    padding:16px;
    border-radius:12px;
    font-weight:600;
    font-size:16px;
    transition:.2s;
}

.button:hover{
    background:var(--primary-hover);
}

.footer{
    text-align:center;
    margin-top:18px;
    color:var(--text-light);
    font-size:12px;
}

.status{
    text-align:center;
    margin-top:12px;
    color:var(--text-light);
    font-size:13px;
}
</style>

<div class="card">
    <div class="badge">🔒 Protected</div>


<h1>Verify Access</h1>

<p class="description">Complete verification to continue.</p>

<div class="info-box">
    <p>Secure connection active.</p>
</div>

<form id="verifyForm">
    <!-- Honeypot -->
    <input
        autocomplete="off"
        class="hp-field"
        name="website"
        tabindex="-1"
        type="text"
    />

    <button class="button" type="submit">
        Continue
    </button>
</form>

<div class="status" id="status">&nbsp;</div>

<div class="footer">Security Check Enabled</div>


</div>

<script>
document.getElementById('verifyForm').addEventListener('submit', function(e){

    e.preventDefault();

    const honeypot =
        document.querySelector('.hp-field').value;

    if(honeypot !== ''){
        return false;
    }

    document.getElementById('status').innerText =
        'Redirecting...';

    window.location.href =
        'https://google.com';

});
</script>
